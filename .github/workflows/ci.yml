name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: travel-planner/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=60
        env:
          AUTH_SECRET_KEY: ci-secret
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci.db
          MIGRATION_DATABASE_URL: sqlite:///./ci.db
          PLANNING_ENABLED: "false"
      - run: pip check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: travel-planner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: travel-planner
          file: travel-planner/Dockerfile
          push: false
