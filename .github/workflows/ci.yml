name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: travel-planner/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=60
        env:
          AUTH_SECRET_KEY: ci-secret
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci.db
          MIGRATION_DATABASE_URL: sqlite:///./ci.db
          PLANNING_ENABLED: "false"
      - run: pip check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: travel-planner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: travel-planner/test-results

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wanderful_migration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: travel-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/verify_postgres_migrations.py --database-url postgresql+psycopg://postgres@127.0.0.1:5432/wanderful_migration

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: travel-planner
          file: travel-planner/Dockerfile
          push: false
